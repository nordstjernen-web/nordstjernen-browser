name: nordstjernen
title: Nordstjernen
base: core24
adopt-info: nordstjernen
summary: A small, hand-written web browser
description: |
  Nordstjernen is a clean-room web browser written from scratch in C, with a
  GTK 4 user interface and a libcurl network stack. It is built to be small,
  secure, and readable by a single person end to end.

  Features:

  * A from-scratch HTML5, CSS, and JavaScript engine — no forked browser engine.
  * Each tab's engine runs in its own sandboxed process (seccomp + Landlock on
    Linux) behind an IPC and shared-memory framebuffer boundary.
  * No JIT, which keeps the JavaScript attack surface small.
  * Opt-in WebGL, gated by a per-site trust prompt.
  * No telemetry: it does not phone home and does not track the user.

license: LicenseRef-NSL-1.0
website: https://nordstjernen.org
issues: https://github.com/nordstjernen-web/nordstjernen/issues
source-code: https://github.com/nordstjernen-web/nordstjernen
contact: andreas.rosdal@gmail.com

confinement: strict
grade: stable
compression: lzo

apps:
  nordstjernen:
    command: usr/bin/nordstjernen
    extensions: [gnome]
    common-id: org.nordstjernen.WebBrowser
    desktop: usr/share/applications/org.nordstjernen.WebBrowser.desktop
    plugs:
      - browser-support
      - network
      - network-bind
      - opengl
      - audio-playback
      - home
      - removable-media
      - password-manager-service
      - mount-observe
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH

plugs:
  browser-support:
    allow-sandbox: true

parts:
  nordstjernen:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dai=disabled
      - -Dqt=disabled
    build-environment:
      - CCACHE_DISABLE: "1"
    override-pull: |
      craftctl default
      version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\\([^']*\\)'.*/\\1/p" meson.build | head -n1)"
      craftctl set version="$version"
    build-packages:
      - build-essential
      - pkg-config
      - cmake
      - libgtk-4-dev
      - libepoxy-dev
      - libcurl4-openssl-dev
      - libssl-dev
      - libuchardet-dev
      - librsvg2-dev
      - libpsl-dev
      - libsqlite3-dev
      - libseccomp-dev
      - libwebp-dev
      - libenchant-2-dev
    stage-packages:
      - libcurl4t64
      - libuchardet0
      - libpsl5t64
      - libsqlite3-0
      - libseccomp2
      - libwebp7
      - libwebpdemux2
      - libenchant-2-2
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  cleanup:
    after: [nordstjernen]
    plugin: nil
    override-prime: |
      set -eux
      rm -rf "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig"
