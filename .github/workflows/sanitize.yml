name: sanitize

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Advisory memory-safety net: an ASan+UBSan build over the headless render
# path plus libFuzzer smoke runs over the in-tree parsers. Not a required
# check — it sanitizes the existing run path, it is not a new test suite.
jobs:
  sanitize:
    name: asan+ubsan headless + fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            clang
            llvm
            libclang-rt-18-dev
            make
            cmake
            pkg-config
            meson
            ninja-build
            libgtk-4-dev
            libepoxy-dev
            libcurl4-openssl-dev
            libssl-dev
            libuchardet-dev
            librsvg2-dev
            libpsl-dev
            libsqlite3-dev
            libwebp-dev
            libsdl2-dev
            libseccomp-dev
            ca-certificates
          version: v1

      - name: ASan + UBSan headless render
        run: |
          export CC=clang CXX=clang++
          ./scripts/sanitize.sh

      - name: libFuzzer smoke (HTML + URL parsers)
        run: CC=clang FUZZ_SECONDS=45 ./scripts/fuzz.sh
