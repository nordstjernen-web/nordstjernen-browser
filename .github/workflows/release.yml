name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build Linux packages for
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    name: ${{ matrix.name }} package
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 90

    # A .deb depends on the SONAME-numbered FFmpeg packages of the release it
    # was built on (libavcodec60 on Ubuntu 24.04, libavcodec61 on Debian 13,
    # …), so each supported release gets its own package, built and verified
    # against that release's own archive.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            distro: ubuntu
            slug: ubuntu-24.04
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            distro: ubuntu
            slug: ubuntu-26.04
          - name: Debian 13
            image: debian:trixie
            distro: debian
            slug: debian-13
            portable_zip: true

    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Installs the build dependencies, builds, packs the zip and the .deb,
      # then installs the .deb in this container and runs it headless.
      - name: Build, package and verify
        run: bash scripts/nightly-distro-build.sh ${{ matrix.distro }}

      # A tag that predates per-release file names packs every job's .deb as
      # nordstjernen_<version>_<arch>.deb; give it the release it was built
      # on, the way scripts/pack-deb.sh names it now, so the jobs' packages
      # don't overwrite each other on the release.
      - name: Name the package for its distro release
        run: |
          tag=$(. /etc/os-release && printf '%s%s' "$ID" "$VERSION_ID")
          for deb in dist/*.deb; do
            case "$deb" in
              *"_${tag}_"*) ;;
              *) mv -v "$deb" "${deb%_*}_${tag}_${deb##*_}" ;;
            esac
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.slug }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable zip
        if: matrix.portable_zip
        uses: actions/upload-artifact@v7
        with:
          name: linux-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- *.deb *.zip > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" ./*.deb ./*.zip ./SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
