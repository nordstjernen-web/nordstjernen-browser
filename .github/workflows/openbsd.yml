name: openbsd

# BSD builds run in a VM nested inside the Linux runner (vmactions), which is
# slow, so they are dispatch-only (the nightly orchestrator drives them) rather
# than on every push/PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: openbsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: clang on OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, smoke and pack in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          copyback: true
          prepare: |
            pkg_add -I \
              meson ninja pkgconf bash zip ccache \
              gtk+4 curl uchardet librsvg sqlite3 libwebp libpsl \
              eopenssl35
          run: |
            set -e
            export CC="ccache cc"
            export CXX="ccache c++"
            # OpenBSD's base libcrypto is LibreSSL, which lacks OpenSSL 3's
            # provider/OSSL_PARAM APIs (openssl/core_names.h) that
            # src/webcrypto.c is written against. The eopenssl3x port installs
            # a parallel OpenSSL 3 under /usr/local/{include,lib}/eopenssl3x;
            # point pkg-config at it so dependency('libcrypto') resolves there.
            eossl_pc=$(ls -d /usr/local/lib/eopenssl*/pkgconfig 2>/dev/null | sort -V | tail -1)
            if [ -z "$eossl_pc" ]; then
              echo "error: eopenssl pkg-config dir not found" >&2
              exit 1
            fi
            export PKG_CONFIG_PATH="$eossl_pc:${PKG_CONFIG_PATH:-}"
            # AI (llama.cpp) is a CMake subproject; skip it on the BSD VM
            # builds to avoid the extra toolchain and a long C++ compile.
            # WAMR's posix platform layer uses MAP_32BIT, which OpenBSD does
            # not provide, so the WebAssembly engine is disabled here.
            meson setup builddir --buildtype=release -Db_ndebug=true \
              -Dai=disabled -Dwasm=disabled
            meson compile -C builddir
            if ./builddir/src/gtk/nordstjernen --headless --dump=text about:start > about.txt 2>/dev/null \
               && grep -q Nordstjernen about.txt; then
              echo "headless smoke: ok"
            else
              echo "headless smoke: skipped"
            fi
            bash ./scripts/pack-bsd.sh openbsd
            ls -l dist/*-openbsd-x86_64.zip
            rm -rf builddir

      - name: Upload OpenBSD portable zip
        if: hashFiles('dist/*-openbsd-x86_64.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-openbsd-x86_64
          path: dist/*-openbsd-x86_64.zip
          if-no-files-found: error
          retention-days: 14
