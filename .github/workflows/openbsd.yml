name: openbsd

# BSD builds run in a VM nested inside the Linux runner (vmactions), which is
# slow, so they are dispatch-only (the nightly orchestrator drives them) rather
# than on every push/PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: openbsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: clang on OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, smoke and pack in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          copyback: true
          prepare: |
            set -e
            # pkg-config ships in the OpenBSD base system, so there is no
            # pkgconf port to install (pkg_add would print "Can't find pkgconf").
            # OpenBSD base libcrypto is LibreSSL, which lacks the OpenSSL 3
            # provider/OSSL_PARAM APIs (openssl/core_names.h) src/webcrypto.c is
            # written against, so pull in the eopenssl3x port too. Install it in
            # the same pkg_add so it resolves through /etc/installurl -- the repo
            # the VM image is actually provisioned from (snapshots). Do NOT build
            # a PKG_PATH from $(uname -r): that points at the frozen release repo,
            # which can lag the image and omit eopenssl entirely. The minor
            # version is part of the stem (eopenssl35, eopenssl36, ...) and tracks
            # ports' current openssl; bump this pin when ports moves on.
            pkg_add -I \
              meson ninja bash zip ccache \
              gtk+4 curl uchardet librsvg sqlite3 libwebp libpsl \
              eopenssl35
            # The eopenssl3x port moves its pkg-config files into the standard
            # /usr/local/lib/pkgconfig and renames them so they don't collide
            # with base LibreSSL (libcrypto.pc -> libecrypto3x.pc). meson asks
            # for dependency('libcrypto'), so alias the renamed crypto module
            # back to the canonical name. Older layouts kept an unrenamed
            # libcrypto.pc under the versioned dir; handle both.
            cpc=$(ls /usr/local/lib/pkgconfig/libecrypto*.pc 2>/dev/null | sort -V | tail -1)
            if [ -z "$cpc" ]; then
              cpc=$(ls /usr/local/lib/eopenssl*/pkgconfig/libcrypto.pc 2>/dev/null | sort -V | tail -1)
            fi
            if [ -z "$cpc" ]; then
              echo "error: eopenssl libcrypto .pc not found" >&2
              ls -lR /usr/local/lib/pkgconfig /usr/local/lib/eopenssl* 2>/dev/null >&2 || true
              exit 1
            fi
            ln -sf "$cpc" /usr/local/lib/pkgconfig/libcrypto.pc
          run: |
            set -e
            export CC="ccache cc"
            export CXX="ccache c++"
            # The eopenssl3x libcrypto.pc alias was installed into the standard
            # pkg-config dir during prepare; make sure it is on the search path
            # so dependency('libcrypto') resolves to OpenSSL 3 rather than base
            # LibreSSL.
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            # AI (llama.cpp) is a CMake subproject; skip it on the BSD VM
            # builds to avoid the extra toolchain and a long C++ compile.
            # WAMR's posix platform layer uses MAP_32BIT, which OpenBSD does
            # not provide, so the WebAssembly engine is disabled here.
            meson setup builddir --buildtype=release -Db_ndebug=true \
              -Dai=disabled -Dwasm=disabled
            meson compile -C builddir
            if ./builddir/src/gtk/nordstjernen --headless --dump=text about:start > about.txt 2>/dev/null \
               && grep -q Nordstjernen about.txt; then
              echo "headless smoke: ok"
            else
              echo "headless smoke: skipped"
            fi
            bash ./scripts/pack-bsd.sh openbsd
            ls -l dist/*-openbsd-x86_64.zip
            rm -rf builddir

      - name: Upload OpenBSD portable zip
        if: hashFiles('dist/*-openbsd-x86_64.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-openbsd-x86_64
          path: dist/*-openbsd-x86_64.zip
          if-no-files-found: error
          retention-days: 14
