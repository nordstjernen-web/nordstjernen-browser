name: qt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Qt 6 frontend on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ccache
            clang
            g++
            make
            cmake
            pkg-config
            meson
            ninja-build
            libgtk-4-dev
            libepoxy-dev
            libcurl4-openssl-dev
            libssl-dev
            libuchardet-dev
            librsvg2-dev
            libpsl-dev
            libsqlite3-dev
            libwebp-dev
            libsdl2-dev
            libseccomp-dev
            qt6-base-dev
            libqt6svg6-dev
            ca-certificates
          version: v2

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-qt-${{ github.sha }}
          restore-keys: |
            ccache-qt-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Select compiler
        run: |
          echo "CC=ccache clang"    >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: |
          clang --version
          meson --version
          ninja --version
          pkg-config --modversion Qt6Widgets || qmake6 --version || true

      - name: Build (engine + Qt frontend)
        id: build
        shell: bash
        run: |
          set -o pipefail
          meson setup builddir -Dqt=enabled
          meson compile -C builddir 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (Qt binary present and executable)
        if: hashFiles('builddir/src/qt/nordstjernen-qt') != ''
        run: |
          test -x builddir/src/qt/nordstjernen-qt
          file builddir/src/qt/nordstjernen-qt
          ldd builddir/src/qt/nordstjernen-qt | head -30

      - name: Headless smoke (Qt shell, offscreen)
        if: hashFiles('builddir/src/qt/nordstjernen-qt') != ''
        run: |
          export QT_QPA_PLATFORM=offscreen
          timeout 15 ./builddir/src/qt/nordstjernen-qt about:start || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then
            echo "qt shell crashed (exit ${code})"; exit 1
          fi
          echo "qt offscreen smoke: ok"

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: qt-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nordstjernen-qt binary
        if: hashFiles('builddir/src/qt/nordstjernen-qt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-qt-linux
          path: builddir/src/qt/nordstjernen-qt
          if-no-files-found: error
          retention-days: 14
